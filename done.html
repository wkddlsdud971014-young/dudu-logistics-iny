<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두두택배 - 접수 완료</title>
<!--
  두두택배 - 접수 완료 (영수증)
  =================================================
  항목과 내용을 줄맞춰 찍는다. 글자를 이어 붙이면 눈으로 못 따라간다.
  운송장 번호를 제일 크게 두고, 앞 두 자리(지점 코드)는 색을 달리해
  어디서 접수했는지 번호만 봐도 알게 했다.
  값이 비어 있어도 '-' 로 찍고 멈추지 않는다.
-->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand">두두택배 접수</div>
    <div class="sub">접수 완료</div>
  </div>
  <nav class="nav">
    <a href="index.html">접수하기</a>
    <a href="list.html">접수 목록</a>
    <a href="track.html">운송장 조회</a>
  </nav>
  <div class="panel" id="panel"></div>
</div>

<script src="calc.js"></script>
<script src="store.js"></script>
<script src="rules.js"></script>
<script>
  const record = Store.last();
  const panel = document.getElementById('panel');

  function row(k, v) {
    return '<div class="rrow"><span class="rk">' + k + '</span><span class="rv">' + v + '</span></div>';
  }

  if (!record) {
    panel.innerHTML =
      '<div class="empty-state">아직 접수한 건이 없습니다.</div>' +
      '<div class="center-actions"><a class="btn-main" href="index.html">접수하러 가기</a></div>';
  } else {
    const no = String(record.trackingNo || '');
    const days = ETA_BUSINESS_DAYS[record.regionType];

    panel.innerHTML =
      '<div class="receipt">' +
        '<div class="receipt-top">' +
          '<div class="receipt-ok">접수가 완료되었습니다</div>' +
          '<div class="receipt-no-label">운송장 번호</div>' +
          '<div class="receipt-no"><span class="head">' + no.slice(0, 2) + '</span>' + no.slice(2) + '</div>' +
          '<div class="receipt-no-hint">앞 두 자리 ' + no.slice(0, 2) + ' = ' + show(record.branchName) + '</div>' +
        '</div>' +

        '<div class="rgroup">보내는 분</div>' +
        '<div class="receipt-rows">' +
          row('이름', show(record.senderName)) +
          row('접수 지점', show(record.branchName)) +
        '</div>' +

        '<div class="rgroup">받는 분</div>' +
        '<div class="receipt-rows">' +
          row('이름', show(record.receiverName)) +
          row('전화', show(record.receiverPhone)) +
          row('지역', show(record.receiverArea)) +
          row('권역', show(record.regionType)) +
        '</div>' +

        '<div class="rgroup">보내는 물건</div>' +
        '<div class="receipt-rows">' +
          row('물품', show(record.itemName)) +
          row('실제 무게', show(toOneDecimal(record.weightKg), 'kg')) +
          row('크기', show(record.widthCm) + ' × ' + show(record.heightCm) + ' × ' + show(record.depthCm) + ' cm') +
          row('요금에 쓴 무게', show(record.billedWeightKg, 'kg')) +
          row('크기 등급', show(record.sizeGrade)) +
        '</div>' +

        '<div class="receipt-total"><span class="tk">받은 금액</span>' +
          '<span class="tv">' + formatWon(record.price) + '</span></div>' +
        '<div class="receipt-eta">도착 예정일<br><b>' + show(record.etaDate) + '</b>' +
          (days ? '<br>접수한 ' + Rules.dayWords(days) + ' (토·일요일은 빼고 셉니다)' : '') +
        '</div>' +
        '<div class="receipt-cut"></div>' +
      '</div>' +

      '<button type="button" class="rules-open" onclick="Rules.open(record)">' +
        '이 요금이 어떻게 나왔는지 규정에서 확인하기</button>' +

      '<div class="center-actions">' +
        '<a class="btn-main" href="index.html">새 접수</a>' +
        '<a class="btn-sub" href="list.html">접수 목록 보기</a>' +
      '</div>';
  }
</script>
</body>
</html>
