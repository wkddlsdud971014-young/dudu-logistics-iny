<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두두택배 - 운송장 출력</title>
<!--
  두두택배 - 운송장 (스티커로 뽑아 상자에 붙이는 것)
  =================================================
  CU 키오스크의 마지막 두 화면(운송장 출력 및 부착 / 이용해 주셔서 감사합니다)
  자리다. 영수증이 아니라 송장이라 실제로 붙일 수 있게 만들었다.
  - 굵은 테두리와 칸 나눔으로 흑백 인쇄에서도 읽힌다
  - 보내는 곳은 흰 칸, 받는 곳은 검은 칸으로 뒤집어 배달 기사가 한눈에 본다
  - 크기 등급과 권역을 맨 위에 크게 두어 분류 작업에서 바로 보인다
  - 인쇄하면 화면 장식은 빠지고 송장만 나온다 (style.css @media print)
  값이 비어 있어도 '-' 로 찍고 멈추지 않는다.
-->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="logo" href="index.html">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none"
             stroke="currentColor" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round">
          <path d="M3 7.5 12 3l9 4.5v9L12 21 3 16.5z"/>
          <path d="M3 7.5 12 12l9-4.5M12 12v9"/>
        </svg>
      </span>
      <span class="logo-word">DO<b>DO</b></span>
      <span class="logo-sub">택배</span>
    </a>
    <div class="sub">운송장 출력 및 부착</div>
    <a class="admin-link" href="admin.html">관리자</a>
  </div>
  <nav class="nav">
    <a href="index.html">접수하기</a>
    <a href="track.html">운송장 조회</a>
  </nav>
  <div class="panel" id="panel"></div>
</div>

<script src="calc.js"></script>
<script src="store.js"></script>
<script src="rules.js"></script>
<script>
  const record = Store.last();
  const panel = document.getElementById('panel');

  // 운송장 번호를 굵기가 다른 막대로 그린다. 진짜 바코드는 아니지만
  // 번호를 그대로 옮긴 것이라 송장다운 모양이 나온다.
  function bars(no) {
    const d = String(no || '').replace(/\D/g, '') || '0';
    return d.split('').map(n => {
      const w = 2 + (Number(n) % 4);
      return '<i style="width:' + w + 'px"></i><i style="width:2px;background:#fff"></i>';
    }).join('');
  }

  if (!record) {
    panel.innerHTML =
      '<div class="empty-state">아직 접수한 건이 없습니다.</div>' +
      '<div class="center-actions"><a class="btn-main" href="index.html">접수하러 가기</a></div>';
  } else {
    const no = String(record.trackingNo || '');
    const days = ETA_BUSINESS_DAYS[record.regionType];

    panel.innerHTML =
      '<div class="waybill">' +
        '<div class="wb-top">' +
          '<div class="wb-logo">두두택배</div>' +
          '<div class="wb-grade">' + show(record.sizeGrade) + '</div>' +
          '<div class="wb-region">' + show(record.regionType) + '</div>' +
        '</div>' +

        '<div class="wb-no">' +
          '<div class="lbl">운송장 번호</div>' +
          '<div class="num"><span class="h">' + no.slice(0, 2) + '</span> ' + no.slice(2) + '</div>' +
          '<div class="wb-bars">' + bars(no) + '</div>' +
        '</div>' +

        '<div class="wb-party">' +
          '<div class="wb-tag">보내는곳</div>' +
          '<div class="wb-body">' +
            '<div class="wb-name">' + show(record.senderName) + '</div>' +
            '<div class="wb-line">' + show(record.senderPhone) + '</div>' +
            '<div class="wb-line">' + show(record.branchName) + ' 접수</div>' +
          '</div>' +
        '</div>' +

        '<div class="wb-party">' +
          '<div class="wb-tag to">받는곳</div>' +
          '<div class="wb-body">' +
            '<div class="wb-name">' + show(record.receiverName) + '</div>' +
            '<div class="wb-line">' + (record.postalCode ? '[' + record.postalCode + '] ' : '') +
              '<b>' + show(record.receiverArea) + '</b> ' + show(record.receiverDong) + '</div>' +
            '<div class="wb-line">' + show(record.receiverPhone) + '</div>' +
            (record.deliveryNote && record.deliveryNote !== '없음'
              ? '<div class="wb-line"><b>요청 ' + record.deliveryNote + '</b></div>' : '') +
          '</div>' +
        '</div>' +

        '<div class="wb-goods">' +
          '<div class="wb-cell"><div class="ck">물품</div><div class="cv">' +
            show(record.itemName) + '</div></div>' +
          '<div class="wb-cell"><div class="ck">종류</div><div class="cv">' +
            show(record.category) + '</div></div>' +
          '<div class="wb-cell"><div class="ck">요금 무게</div><div class="cv">' +
            show(record.billedWeightKg, 'kg') + '</div></div>' +
        '</div>' +
        '<div class="wb-goods">' +
          '<div class="wb-cell"><div class="ck">크기 (가로 세로 높이)</div><div class="cv">' +
            show(record.widthCm) + ' ' + show(record.heightCm) + ' ' + show(record.depthCm) + ' cm</div></div>' +
          '<div class="wb-cell"><div class="ck">도착 예정</div><div class="cv">' +
            show(record.etaDate) + '</div></div>' +
        '</div>' +

        '<div class="wb-pay"><div class="pk">' + show(record.payType, ' 요금') +
          (record.payMethod ? '<br><span style="font-size:10.5px;font-weight:600">' + record.payMethod + '</span>' : '') + '</div>' +
          '<div class="pv">' + formatWon(record.price) + '</div></div>' +
        '<div class="wb-foot">' +
          (record.payType === '착불' ? '<b>받는 분이 물건 받을 때 내는 요금입니다</b><br>' : '') +
          (days ? '접수한 ' + Rules.dayWords(days) + ' 도착 예정입니다 (토·일요일은 빼고 셉니다)' : '') +
        '</div>' +
      '</div>' +

      '<div class="wb-actions">' +
        '<button type="button" class="wb-print" onclick="window.print()">운송장 출력</button>' +
        '<a class="wb-again" href="index.html">추가 접수</a>' +
        '<a class="wb-end" href="track.html?no=' + no + '">운송장 조회</a>' +
      '</div>' +

      '<button type="button" class="rules-open" onclick="Rules.open(record)">' +
        '이 요금이 어떻게 나왔는지 규정에서 확인하기</button>' +

      '<div class="cantsend" style="margin-top:16px">' +
        '<h4>운송장 붙이는 법</h4>' +
        '<ul><li>출력한 운송장을 상자 <b>윗면 평평한 곳</b>에 붙여 주세요</li>' +
        '<li>테이프로 <b>번호를 덮지 마세요</b>. 배달할 때 읽지 못합니다</li>' +
        '<li>먼저 붙어 있던 다른 운송장은 <b>떼거나 지워</b> 주세요</li></ul></div>';
  }
</script>
</body>
</html>
