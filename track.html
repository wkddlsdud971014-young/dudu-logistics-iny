<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두두택배 - 운송장 조회</title>
<!--
  두두택배 - 운송장 조회
  =================================================
  번호 10자리로 표에서 한 건을 찾아 보여 준다.
  이 화면은 표(Supabase)를 붙인 뒤에야 쓸모가 있다. 브라우저 안에만
  자료가 있을 때는 다른 창구에서 접수한 건을 못 찾기 때문이다.
  값이 비어 있어도 '-' 로 찍고 멈추지 않는다.
-->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="logo" href="index.html">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none"
             stroke="currentColor" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round">
          <path d="M3 7.5 12 3l9 4.5v9L12 21 3 16.5z"/>
          <path d="M3 7.5 12 12l9-4.5M12 12v9"/>
        </svg>
      </span>
      <span class="logo-word">DO<b>DO</b></span>
      <span class="logo-sub">택배</span>
    </a>
    <a class="admin-link" href="admin.html">관리자</a>
  </div>
  <nav class="nav">
    <a href="index.html">접수하기</a>
    <a href="track.html" class="on">운송장 조회</a>
  </nav>

  <div class="panel">
    <h2 class="step-q" style="font-size:19px">운송장 번호를 넣어 주세요</h2>
    <p class="step-sub">숫자 10자리입니다. 앞 두 자리는 접수한 지점 번호입니다.</p>
    <div class="f">
      <div class="search-box" style="margin-bottom:0">
        <span class="ico">🔍</span>
        <input type="tel" id="q" placeholder="1100000001" inputmode="numeric" maxlength="13" autocomplete="off">
      </div>
      <div class="err" id="qerr"></div>
    </div>
    <button type="button" class="rules-open" id="go" style="margin-top:4px">조회하기</button>
    <div id="out" style="margin-top:18px"></div>
    <div class="center-actions">
      <button type="button" class="btn-main" id="again">다른 번호 조회</button>
      <button type="button" class="btn-sub" onclick="Rules.open()">요금 규정 보기</button>
    </div>
  </div>
</div>

<script src="calc.js"></script>
<script src="store.js"></script>
<script src="rules.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const row = (k, v) => '<div class="rrow"><span class="rk">' + k + '</span><span class="rv">' + v + '</span></div>';

  // 숫자만 남기고 보기 좋게 끊어 준다
  $('q').addEventListener('input', e => {
    const d = e.target.value.replace(/\D/g, '').slice(0, 10);
    e.target.value = d.length > 2 ? d.slice(0, 2) + ' ' + d.slice(2) : d;
    $('qerr').textContent = '';
  });
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter') find(); });
  $('go').onclick = find;

  async function find() {
    const no = $('q').value.replace(/\D/g, '');
    $('out').innerHTML = '';
    if (no.length !== 10) {
      $('qerr').textContent = '숫자 10자리를 넣어 주세요 (지금 ' + no.length + '자리).';
      return;
    }
    $('qerr').textContent = '';
    $('go').textContent = '찾는 중...';
    const got = await Store.find(no);
    $('go').textContent = '조회하기';

    if (!got.row) {
      $('out').innerHTML = '<div class="search-none"><b>' + no.slice(0, 2) + ' ' + no.slice(2) +
        ' 로 접수된 건이 없습니다.</b><br>번호를 다시 확인해 주세요.' +
        (got.offline ? '<br><br>⚠️ 지금 서버에 못 닿아 이 브라우저 것만 찾았습니다.' : '') +
        '</div>';
      return;
    }
    const r = got.row;
    const days = ETA_BUSINESS_DAYS[r.regionType];
    $('out').innerHTML =
      '<div class="receipt"><div class="receipt-top">' +
        '<div class="receipt-ok">' + show(r.status || '집화처리') + '</div>' +
        '<div class="receipt-no-label">운송장 번호</div>' +
        '<div class="receipt-no">' + no.slice(0, 2) + ' ' + no.slice(2) + '</div>' +
        '<div class="receipt-no-hint">' + show(r.branchName) + ' 접수</div>' +
      '</div><div class="receipt-rows">' +
        row('보내는 분', show(r.senderName)) +
        row('받는 분', show(r.receiverName)) +
        row('받는 곳', show(r.receiverArea) + ' ' + show(r.receiverDong)) +
        row('물품', show(r.itemName) + ' · ' + show(r.category)) +
        row('요금 무게', show(r.billedWeightKg, 'kg') + ' · ' + show(r.sizeGrade)) +
        row('요금', formatWon(r.price) + ' · ' + show(r.payType) + (r.payMethod ? ' (' + r.payMethod + ')' : '')) +
        row('도착 예정', show(r.etaDate) + (days ? ' (' + Rules.dayWords(days) + ')' : '')) +
      '</div></div>' +
      '<button type="button" class="rules-open" id="why">이 요금이 어떻게 나왔는지 규정에서 확인하기</button>' +
      (got.offline ? '<p class="tip" style="text-align:center">⚠️ 서버에 못 닿아 이 브라우저 것을 보여드렸습니다</p>' : '');
    // 인라인으로 붙이면 따옴표가 섞여 안 열린다. 코드로 붙인다.
    $('why').onclick = () => Rules.open(r);
  }

  $('again').onclick = () => {
    $('out').innerHTML = '';
    $('q').value = '';
    $('q').focus();
  };

  // 접수 직후 넘어오면 방금 그 번호를 넣어 드릴지 여쭤본다
  (function fromReceipt() {
    const p = new URLSearchParams(location.search).get('no');
    const no = String(p || '').replace(/\D/g, '');
    if (no.length !== 10) return;
    const pretty = no.slice(0, 2) + ' ' + no.slice(2);
    if (confirm('방금 접수하신 운송장 번호 ' + pretty + ' 로 조회할까요?\n\n[취소] 를 누르시면 다른 번호를 넣으실 수 있습니다.')) {
      $('q').value = pretty;
      find();
    } else {
      $('q').focus();
    }
  })();
</script>
</body>
</html>
