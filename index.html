<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두두택배 - 접수하기</title>
<!--
  두두택배 - 접수하기 (CU 키오스크식 5단계)
  =================================================
  4LsRETROSPECTIVEDAY14.md 13줄에 적은 컨셉을 그대로 옮겼다 -
  "지역은 버튼으로 고르게 하고, 전화번호는 자동으로 모양을 맞춰주고,
   요금과 도착 예정일은 기계가 계산하게"
  편의점 키오스크는 손가락으로 누르는 기계라 고르는 것은 전부 버튼이다.
  한 화면에 한 가지만 묻고, 다 채우면 다음으로 넘어간다.
  계산은 calc.js, 디자인은 style.css, 저장은 store.js 에 있다.
-->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand">두두택배 접수</div>
    <div class="sub">접수하기</div>
  </div>
  <nav class="nav">
    <a href="index.html" class="on">접수하기</a>
    <a href="list.html">접수 목록</a>
    <a href="track.html">운송장 조회</a>
  </nav>

  <div class="panel wizard">
    <div class="steps" id="dots"></div>
    <p class="step-count" id="stepCount"></p>

    <section class="step" data-step="1">
      <h2 class="step-q">어디에서 접수하시나요?</h2>
      <p class="step-sub">운송장 번호 앞 두 자리가 이 지점 코드가 됩니다 (규정 §9).</p>
      <div class="opt-grid" id="branchGrid"></div>
    </section>

    <section class="step" data-step="2">
      <h2 class="step-q">어디로 보내시나요?</h2>
      <p class="step-sub">목록에 있는 곳만 고를 수 있습니다. 권역과 요금은 저절로 정해집니다.</p>
      <div class="opt-grid" id="areaGrid"></div>
      <div class="opt-label">섬 지역 (도서산간)</div>
      <div class="opt-grid" id="islandGrid"></div>
      <div class="opt-label">배송 권역 <span class="auto-tag">자동</span></div>
      <div class="auto-box empty" id="regionAuto">지역을 고르면 정해집니다</div>
    </section>

    <section class="step" data-step="3">
      <h2 class="step-q">누가 보내고, 누가 받나요?</h2>
      <p class="step-sub">전화번호는 숫자만 누르시면 모양이 저절로 맞춰집니다.</p>
      <div class="f">
        <label for="senderName">보내는 분</label>
        <input type="text" id="senderName" placeholder="김민준" autocomplete="off">
        <div class="err" id="e_senderName"></div>
      </div>
      <div class="f">
        <label for="receiverName">받는 분</label>
        <input type="text" id="receiverName" placeholder="이서연" autocomplete="off">
        <div class="err" id="e_receiverName"></div>
      </div>
      <div class="f">
        <label for="receiverPhone">받는 분 전화</label>
        <input type="tel" id="receiverPhone" placeholder="010-1234-5678" inputmode="numeric" autocomplete="off">
        <div class="err" id="e_receiverPhone"></div>
      </div>
    </section>

    <section class="step" data-step="4">
      <h2 class="step-q">무엇을 보내시나요?</h2>
      <p class="step-sub">무게와 크기로 요금이 정해집니다 (규정 §3·§4).</p>
      <div class="f">
        <label for="itemName">물품명</label>
        <input type="text" id="itemName" placeholder="이불" autocomplete="off">
        <div class="err" id="e_itemName"></div>
      </div>
      <div id="banBox"></div>
      <div class="soft-confirm" id="softConfirmBox" style="display:none">
        <div id="softConfirmText"></div>
        <label><input type="checkbox" id="staffConfirm"> 위 항목을 직원이 확인했습니다</label>
      </div>
      <div class="f">
        <label for="weightKg">실제 무게 (kg)</label>
        <input type="number" id="weightKg" placeholder="3.0" step="any" inputmode="decimal">
        <div class="err" id="e_weightKg"></div>
      </div>
      <div class="f">
        <label>가로 · 세로 · 높이 (cm)</label>
        <div class="dim3">
          <input type="number" id="widthCm" placeholder="가로" step="any" inputmode="decimal">
          <input type="number" id="heightCm" placeholder="세로" step="any" inputmode="decimal">
          <input type="number" id="depthCm" placeholder="높이" step="any" inputmode="decimal">
        </div>
        <div class="err" id="e_dims"></div>
      </div>
    </section>

    <section class="step" data-step="5">
      <h2 class="step-q">이대로 접수할까요?</h2>
      <div class="big-price" id="bigPrice"></div>
      <div class="sum" id="summary"></div>
      <details class="why">
        <summary>왜 이 요금인가요?</summary>
        <div class="why-body" id="whyBody"></div>
      </details>
    </section>

    <div class="step-actions">
      <button type="button" id="prevBtn">이전</button>
      <button type="button" id="nextBtn">다음</button>
    </div>
  </div>
</div>

<script src="calc.js"></script>
<script src="store.js"></script>
<script>
  const TOTAL = 5;
  const STEP_NAME = ['접수 지점', '도착 지역', '보내는 분·받는 분', '물품·무게·크기', '확인'];
  let step = 1;
  const S = { branch: '', area: '' };   // 버튼으로 고르는 값만 여기 담는다

  const $ = id => document.getElementById(id);
  const val = id => $(id).value.trim();

  // ── 고르는 버튼 ─────────────────────────────────────────
  function optButton(value, label, sub, onPick) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.dataset.value = value;
    b.innerHTML = sub ? label + '<span class="opt-sub">' + sub + '</span>' : label;
    b.onclick = () => onPick(value);
    return b;
  }
  function paintPicked(gridIds, picked) {
    gridIds.forEach(gid => $(gid).querySelectorAll('.opt')
      .forEach(b => b.classList.toggle('on', b.dataset.value === picked)));
  }

  BRANCHES.forEach(b => $('branchGrid').appendChild(
    optButton(b.name, b.name.replace('지점', ''), '코드 ' + b.code, v => {
      S.branch = v;
      paintPicked(['branchGrid'], v);
      sync();
      setTimeout(() => go(2), 160);          // 키오스크답게 바로 다음 화면으로
    })));

  function pickArea(v) {
    S.area = v;
    paintPicked(['areaGrid', 'islandGrid'], v);
    const region = determineRegion(v);
    const box = $('regionAuto');
    box.className = 'auto-box';
    box.textContent = region + ' · 접수 후 ' + ETA_BUSINESS_DAYS[region] + '영업일';
    sync();
    setTimeout(() => go(3), 200);
  }
  AREA_LIST.filter(a => a.region !== '도서산간').forEach(a => $('areaGrid').appendChild(
    optButton(a.area, a.area, a.region === '일반' ? null : a.region, pickArea)));
  AREA_LIST.filter(a => a.region === '도서산간').forEach(a => $('islandGrid').appendChild(
    optButton(a.area, a.area, null, pickArea)));

  // ── 전화번호는 치는 대로 모양을 맞춘다 ──────────────────
  $('receiverPhone').addEventListener('input', e => {
    e.target.value = formatPhone(e.target.value);
    sync();
  });
  ['senderName', 'receiverName', 'itemName', 'weightKg', 'widthCm', 'heightCm', 'depthCm']
    .forEach(id => $(id).addEventListener('input', sync));
  $('staffConfirm').addEventListener('change', sync);

  // ── 단계별 검사 ─────────────────────────────────────────
  function checkStep(n) {
    const errs = {};
    if (n === 1 && !branchCodeOf(S.branch)) errs._ = '접수 지점을 골라 주세요.';
    if (n === 2 && !determineRegion(S.area)) errs._ = '도착 지역을 골라 주세요.';
    if (n === 3) {
      if (!val('senderName')) errs.senderName = '보내는 분 이름을 입력해 주세요.';
      if (!val('receiverName')) errs.receiverName = '받는 분 이름을 입력해 주세요.';
      else if (/[()（）]|님\s*$/.test(val('receiverName')))
        errs.receiverName = '이름만 적어 주세요. 요청사항·호칭은 넣지 않습니다.';
      const p = val('receiverPhone');
      if (!p) errs.receiverPhone = '받는 분 전화번호를 입력해 주세요.';
      else if (!isValidPhone(p)) errs.receiverPhone = '자릿수가 맞지 않습니다 (지금 ' + phoneDigits(p).length + '자리).';
    }
    if (n === 4) {
      if (!val('itemName')) errs.itemName = '물품명을 입력해 주세요.';
      const ban = checkBanned(val('itemName'));
      if (ban.hardHits.length) {
        errs.itemName = '접수 불가 품목입니다 — ' + ban.hardHits[0].category +
          ' "' + ban.hardHits[0].keyword + '" (규정 §5).';
      } else if (ban.softHits.length && !$('staffConfirm').checked) {
        errs.itemName = '직원 확인 체크가 필요합니다.';
      }
      const w = checkNumber('weightKg', val('weightKg'));
      if (w.err) errs.weightKg = w.err;
      const dims = ['widthCm', 'heightCm', 'depthCm'].map(k => checkNumber(k, val(k)));
      const dimErr = dims.find(d => d.err);
      if (dimErr) errs.dims = dimErr.err;
      if (!w.err && !dimErr) {
        const sum = dims.reduce((t, d) => t + d.n, 0);
        const bw = Math.max(w.n, dims.reduce((t, d) => t * d.n, 1) / 6000);
        if (!determineGrade(sum, bw)) {
          errs.dims = '대형 상한을 넘었습니다 — 세 변의 합 ' + sum + 'cm, 요금 무게 ' +
            bw.toFixed(2) + 'kg (규정 §3). 상담원을 연결해 주세요.';
        }
      }
    }
    return errs;
  }

  // ── 화면 갱신 ───────────────────────────────────────────
  function sync() {
    if (step === 4) {
      const ban = checkBanned(val('itemName'));
      const box = $('banBox'), soft = $('softConfirmBox');
      if (ban.hardHits.length) {
        const h = ban.hardHits[0];
        box.innerHTML = '<span class="badge bad">접수 불가 — ' + h.category + ' "' + h.keyword +
          '" (규정 §5). 요금 계산 전에 거절합니다.</span>';
        soft.style.display = 'none';
      } else if (ban.softHits.length) {
        box.innerHTML = '<span class="badge warn">직원 확인이 필요한 낱말이 있습니다 ' +
          '(규정 §5 "애매하면 사람에게 넘깁니다").</span>';
        soft.style.display = 'block';
        $('softConfirmText').innerHTML = ban.softHits
          .map(h => '・<b>' + h.keyword + '</b> — ' + h.ask).join('<br>');
      } else {
        box.innerHTML = '';
        soft.style.display = 'none';
      }
    }
    const errs = checkStep(step);
    ['senderName', 'receiverName', 'receiverPhone', 'itemName', 'weightKg', 'dims']
      .forEach(k => { const el = $('e_' + k); if (el) el.textContent = errs[k] || ''; });
    $('nextBtn').disabled = Object.keys(errs).length > 0;
  }

  function go(n) {
    if (n > step && Object.keys(checkStep(step)).length) return;
    step = Math.min(TOTAL, Math.max(1, n));
    document.querySelectorAll('.step').forEach(s =>
      s.classList.toggle('on', Number(s.dataset.step) === step));
    $('dots').innerHTML = Array.from({ length: TOTAL }, (_, i) =>
      '<div class="dot ' + (i + 1 < step ? 'done' : i + 1 === step ? 'on' : '') + '"></div>').join('');
    $('stepCount').textContent = step + ' / ' + TOTAL + ' · ' + STEP_NAME[step - 1];
    $('prevBtn').style.visibility = step === 1 ? 'hidden' : 'visible';
    $('nextBtn').textContent = step === TOTAL ? '접수 완료' : '다음';
    if (step === TOTAL) renderConfirm();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    sync();
  }

  // ── 마지막 확인 화면 ────────────────────────────────────
  function draft() {
    const w = Number(val('weightKg'));
    const x = Number(val('widthCm')), y = Number(val('heightCm')), z = Number(val('depthCm'));
    const vol = (x * y * z) / 6000, billed = Math.max(w, vol), sum = x + y + z;
    const grade = determineGrade(sum, billed), region = determineRegion(S.area);
    const price = RATE_TABLE.find(t => t.grade === grade).price[region];
    const eta = addBusinessDaysTrace(new Date(), ETA_BUSINESS_DAYS[region]);
    return { w, x, y, z, vol, billed, sum, grade, region, price, eta };
  }

  function renderConfirm() {
    const d = draft();
    $('bigPrice').innerHTML =
      '<div class="won">' + formatWon(d.price) + '</div>' +
      '<div class="eta">' + d.grade + ' · ' + d.region + ' · 도착 예정 ' +
      formatDateISO(d.eta.finalDate) + '(' + WEEKDAY_KO[d.eta.finalDate.getDay()] + ')</div>';

    const rows = [
      ['접수 지점', S.branch + ' (' + branchCodeOf(S.branch) + ')'],
      ['보내는 분', val('senderName')],
      ['받는 분', val('receiverName') + ' · ' + val('receiverPhone')],
      ['도착 지역', S.area + ' · ' + d.region + ' 권역'],
      ['물품', val('itemName')],
      ['실제 무게', d.w + 'kg'],
      ['크기', d.x + ' × ' + d.y + ' × ' + d.z + ' cm (합 ' + d.sum + 'cm)'],
      ['요금 무게', d.billed.toFixed(2) + 'kg'],
      ['크기 등급', d.grade],
    ];
    $('summary').innerHTML = rows.map(r =>
      '<div class="sum-row"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>').join('');

    const gt = gradeTrace(d.sum, d.billed);
    const gradeLines = gt.lines.map(l => l.grade + '(' + l.maxSum + 'cm / ' + l.maxWeight + 'kg): ' +
      (l.pass ? '<b>통과 → 이 등급</b>'
        : (!l.sumOk && !l.wtOk ? '둘 다 초과' : !l.sumOk ? '세변합 초과' : '무게 초과'))).join('<br>');
    const etaLines = d.eta.trace.map(t => formatDateISO(t.date) + '(' + WEEKDAY_KO[t.dow] + ') — ' +
      (t.isWeekend ? '주말이라 제외' : '영업일 ' + t.countedAt + '일째')).join('<br>');

    $('whyBody').innerHTML =
      '<div class="calc-step"><div class="calc-step-title">1. 부피 무게 (규정 §4)</div><div class="calc-step-body">' +
        d.x + ' × ' + d.y + ' × ' + d.z + ' ÷ 6000 = <b>' + d.vol.toFixed(2) + 'kg</b></div></div>' +
      '<div class="calc-step"><div class="calc-step-title">2. 요금 무게 (규정 §4)</div><div class="calc-step-body">' +
        '실제 ' + d.w + 'kg 과 부피 ' + d.vol.toFixed(2) + 'kg 중 큰 값 = <b>' + d.billed.toFixed(2) + 'kg</b></div></div>' +
      '<div class="calc-step"><div class="calc-step-title">3. 크기 등급 (규정 §3)</div><div class="calc-step-body">' +
        gradeLines + '</div></div>' +
      '<div class="calc-step"><div class="calc-step-title">4. 요금 (규정 §3 요금표)</div><div class="calc-step-body">' +
        d.grade + ' × ' + d.region + ' = <b>' + formatWon(d.price) + '</b></div></div>' +
      '<div class="calc-step"><div class="calc-step-title">5. 도착 예정일 (규정 §6)</div><div class="calc-step-body">' +
        etaLines + '</div></div>';
  }

  // ── 접수 ────────────────────────────────────────────────
  function submit() {
    const d = draft();
    Store.save({
      trackingNo: Store.nextTrackingNo(branchCodeOf(S.branch)),
      branchName: S.branch,
      senderName: val('senderName'),
      receiverName: val('receiverName'),
      receiverPhone: val('receiverPhone'),
      receiverArea: S.area,
      regionType: d.region,
      itemName: val('itemName'),
      weightKg: d.w, widthCm: d.x, heightCm: d.y, depthCm: d.z,
      volumeWeightKg: Math.round(d.vol * 100) / 100,
      billedWeightKg: Math.round(d.billed * 10) / 10,
      sizeGrade: d.grade,
      price: d.price,
      etaDate: formatDateISO(d.eta.finalDate),
    });
    location.href = 'done.html';
  }

  $('prevBtn').onclick = () => go(step - 1);
  $('nextBtn').onclick = () => (step === TOTAL ? submit() : go(step + 1));
  go(1);
</script>
</body>
</html>
